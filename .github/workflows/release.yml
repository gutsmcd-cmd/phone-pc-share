# Builds Windows + Linux programs and publishes them as the "latest" release.
name: Build release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: |
          mkdir dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/phone-pc-share-windows.exe .
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/phone-pc-share-linux .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/phone-pc-share-mac .
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --title "Phone PC Share (latest)" --notes "Windows: phone-pc-share-windows.exe · Linux: phone-pc-share-linux (chmod +x) · Mac: phone-pc-share-mac (untested)"
